name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Doctor against a running app
        run: |
          PORT=4770 DATA_ROOT="$RUNNER_TEMP/data" npm start > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4770/api/health >/dev/null && break; sleep 1; done
          PORT=4770 DATA_ROOT="$RUNNER_TEMP/data" npm run doctor

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner

  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history and tree (counts only, the list is never printed)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          list="$RUNNER_TEMP/forbidden.txt"
          printf '%s\n' "$FORBIDDEN_STRINGS" | grep -v '^$' > "$list" || true
          test -s "$list" || { echo "FORBIDDEN_STRINGS secret is empty"; exit 1; }
          hist=$(git log -p --all | grep -cF -f "$list" || true)
          tree=$(git grep -l -F -f "$list" -- . || true)
          tree_count=$(printf '%s' "$tree" | grep -c . || true)
          echo "history hits: $hist"
          echo "tree files with hits: $tree_count"
          test "$hist" = "0" && test "$tree_count" = "0"
