# Local Docker form: serves the Privilege Map LAB on 127.0.0.1 only. Mock only: no tenant, no credentials, no outbound calls.
services:
  privilege-map:
    build: .
    image: privilege-map-lab:local
    ports:
      - "127.0.0.1:${HOST_PORT:-5301}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
