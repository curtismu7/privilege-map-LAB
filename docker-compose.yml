# Local Docker form. Publishes 127.0.0.1 only. Mock only: no tenant, no credentials, no outbound calls.
# Change the published port with HOST_PORT=<port> docker compose up --build -d
services:
  privilege-map:
    build: .
    image: privilege-map-lab:local
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      MODE: mock
      LAB_PROXY_ORIGINS: "${LAB_PROXY_ORIGINS:-https://local.ping-devops.com:8443}"
      HOST_PORT: "${HOST_PORT:-5301}"
    ports:
      - "127.0.0.1:${HOST_PORT:-5301}:5301"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
