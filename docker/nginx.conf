server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # demo-health/1: public, GET only, no detail (see demo-shelf docs/health-contract.md).
  location = /api/health {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"schema":"demo-health/1","state":"ready","runtime":"offline","demo":{"id":"privilege-map","name":"Privilege Map LAB","version":"0.1.0"}}';
  }

  location / {
    try_files $uri /index.html;
  }
}
